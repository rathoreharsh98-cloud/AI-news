<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VERITAS OSINT v2.0 — Executive Slide Deck</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #070b14;
      --surface: #0f1626;
      --card: #131c31;
      --border: #24324d;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --cyan: #22d3ee;
      --blue: #3b82f6;
      --emerald: #10b981;
      --amber: #f59e0b;
      --rose: #f43f5e;
      --purple: #a855f7;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      background: #0b1120;
      border-bottom: 1px solid var(--border);
      gap: 12px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      letter-spacing: 0.04em;
      font-size: 14px;
    }
    .badge {
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      color: #04101d;
      padding: 3px 8px;
      border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      font-weight: 800;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    button {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    button:hover:not(:disabled) {
      border-color: var(--cyan);
      color: var(--cyan);
    }
    button.primary {
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      color: #04101d;
      border: none;
      font-weight: 800;
    }
    button.primary:hover { opacity: 0.92; color: #04101d; }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    .counter {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      color: var(--muted);
      padding: 0 6px;
    }
    .stage-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .slide {
      width: 100%;
      max-width: 1040px;
      aspect-ratio: 16 / 9;
      min-height: 520px;
      background: radial-gradient(circle at top right, #162442 0%, var(--surface) 58%);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 40px 46px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.65);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }
    .slide-kicker {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      letter-spacing: 0.1em;
      color: var(--cyan);
      font-weight: 700;
      margin-bottom: 10px;
    }
    .slide h1 {
      font-size: 32px;
      line-height: 1.2;
      font-weight: 800;
      margin-bottom: 14px;
    }
    .slide p.lead {
      font-size: 16px;
      line-height: 1.6;
      color: var(--muted);
      max-width: 820px;
    }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 22px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-top: 18px; }
    .grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 18px; }
    .box {
      background: rgba(10, 15, 28, 0.85);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
    }
    .box h3 {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
      margin-bottom: 8px;
    }
    .box p, .box li {
      font-size: 13px;
      line-height: 1.5;
      color: var(--muted);
    }
    .box ul { padding-left: 18px; margin-top: 6px; }
    .box li { margin-bottom: 4px; }
    .c-cyan { color: var(--cyan); }
    .c-emerald { color: var(--emerald); }
    .c-amber { color: var(--amber); }
    .c-purple { color: var(--purple); }
    .c-rose { color: var(--rose); }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 14px;
      font-size: 13.5px;
    }
    th, td {
      text-align: left;
      padding: 11px 12px;
      border-bottom: 1px solid var(--border);
    }
    th {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
    }
    .stat-num {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 34px;
      font-weight: 900;
      margin-bottom: 4px;
    }
    .slide-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 14px;
      border-top: 1px solid rgba(36, 50, 77, 0.7);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11.5px;
      color: var(--muted);
    }
    .filmstrip {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 18px 18px;
      flex-wrap: wrap;
    }
    .pill {
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 11.5px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
      cursor: pointer;
    }
    .pill.active {
      background: var(--cyan);
      color: #04101d;
      border-color: var(--cyan);
      font-weight: 800;
    }
    .mockup-split {
      display: grid;
      grid-template-columns: 5fr 7fr;
      gap: 12px;
      margin-top: 10px;
    }
    .phone-frame {
      max-width: 310px;
      margin: 10px auto 0;
      border: 2px solid var(--cyan);
      border-radius: 20px;
      padding: 14px;
      background: #080d19;
    }
    .tab-bar {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-family: ui-monospace, monospace;
      font-size: 11px;
    }
    .tab-item { padding: 5px 2px; border-radius: 6px; background: var(--card); color: var(--muted); }
    .tab-item.hi { background: var(--cyan); color: #04101d; font-weight: 800; }
    .print-all { display: none; }
    @media (max-width: 820px) {
      .slide { aspect-ratio: auto; padding: 24px; min-height: auto; }
      .slide h1 { font-size: 22px; }
      .grid-3, .grid-2, .grid-5, .mockup-split { grid-template-columns: 1fr; }
    }
    @media print {
      body { background: #070b14 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .topbar, .stage-wrap, .filmstrip { display: none !important; }
      .print-all { display: block !important; }
      .print-slide { page-break-after: always; padding: 20px; }
      .print-slide .slide { max-width: 100%; box-shadow: none; }
    }
  </style>
</head>
<body>

    <div class="controls">
      <button id="prevBtn">← Previous</button>

      <button id="nextBtn" class="primary">Next →</button>
      <button id="fsBtn" title="Press F for fullscreen">⛶ Fullscreen</button>

  <main class="stage-wrap">
    <section id="slideMount" class="slide"></section>

        body: () => `

                </div>
                <div style="padding:10px;border-radius:8px;background:#131c31;font-size:11.5px;color:#cbd5e1">

      {

        footerRight: 'READY FOR USE',
        body: () => `

      }
    ];

    let idx = 0;

    function buildSlideHtml(s) {
      return `
        <div>
          <div class="slide-kicker">${s.kicker}</div>
          <h1>${s.title}</h1>
          ${s.body()}
        </div>
        <div class="slide-footer">
          <span>${s.footerLeft}</span>
          <span>${s.footerRight}</span>
        </div>
      `;
    }

    function render() {
      const s = SLIDES[idx];
      document.getElementById('slideMount').innerHTML = buildSlideHtml(s);
      document.getElementById('counter').textContent = `${idx + 1} / ${SLIDES.length}`;
      document.getElementById('prevBtn').disabled = idx === 0;
      document.getElementById('nextBtn').disabled = idx === SLIDES.length - 1;

      const strip = document.getElementById('filmstrip');
      strip.innerHTML = SLIDES.map((sl, i) =>
        `<button class="pill ${i === idx ? 'active' : ''}" onclick="go(${i})">${sl.tab}</button>`
      ).join('');
    }

    // Populate print-all container for 1-click PDF export
    document.getElementById('printAll').innerHTML = SLIDES.map(
      (s) => `<div class="print-slide"><section class="slide">${buildSlideHtml(s)}</section></div>`
    ).join('');

    window.go = (i) => { idx = i; render(); };
    document.getElementById('prevBtn').onclick = () => { if (idx > 0) { idx--; render(); } };
    document.getElementById('nextBtn').onclick = () => { if (idx < SLIDES.length - 1) { idx++; render(); } };
    document.getElementById('fsBtn').onclick = () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
      else document.exitFullscreen?.();
    };
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' && idx < SLIDES.length - 1) { idx++; render(); }
      if (e.key === 'ArrowLeft' && idx > 0) { idx--; render(); }
      if (e.key.toLowerCase() === 'f') {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
        else document.exitFullscreen?.();
      }
    });

    render();
  </script>
</body>
</html>
