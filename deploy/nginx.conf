# VERITAS OSINT - production nginx config (non-root, port 8080)
# CSP allows exactly the external hosts the frontend uses:
#   tiles: basemaps.cartocdn.com, server.arcgisonline.com, tile.opentopomap.org, tile.openstreetmap.org
#   data:  earthquake.usgs.gov      styles: unpkg.com (leaflet.css), fonts.googleapis.com
#   fonts: fonts.gstatic.com
pid /tmp/nginx.pid;
worker_processes 1;
events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    server {
        listen 8080 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.basemaps.cartocdn.com https://server.arcgisonline.com https://*.tile.opentopomap.org https://*.tile.openstreetmap.org https://unpkg.com; connect-src 'self' https://earthquake.usgs.gov;" always;

        # Hashed build assets: cache hard. index.html: never cache (instant updates).
        location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404; }
        location = /index.html { add_header Cache-Control "no-cache"; }

        location / { try_files $uri $uri/ /index.html; }

        # Same-origin API (only used if the api container is running)
        location /api/ {
            proxy_pass http://veritas-api:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
        }

        location = /healthz { access_log off; default_type text/plain; return 200 "healthy\n"; }
    }
}
