# VERITAS OSINT - slim 24/7 stack for a 1 GB e2-micro (~200 MB RAM total)
# Web is bound to 127.0.0.1 only; Tailscale Serve/Funnel publishes it over HTTPS.
# Usage: docker compose -f deploy/docker-compose.free.yml up -d --build
name: veritas

x-common: &common
  restart: always
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }   # never fill the 30 GB disk

services:
  veritas-web:
    <<: *common
    build: { context: .., dockerfile: deploy/Dockerfile.free, target: web }
    image: veritas-web:latest
    ports: ["127.0.0.1:${VERITAS_PORT:-8080}:8080"]
    mem_limit: 96m
    cpus: 0.5
    depends_on: [veritas-api]

  veritas-api:
    <<: *common
    build: { context: .., dockerfile: deploy/Dockerfile.free, target: api }
    image: veritas-api:latest
    environment:
      - NODE_ENV=production
      - PORT=8081
    mem_limit: 192m
    cpus: 0.75
